<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seminari 3 · Càlcul</title>
  <meta name="description" content="Entrenador d'exercicis del Tercer Seminari de Càlcul: regla de la cadena, derivada via límit, estudi de funcions i límits a l'infinit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <span class="logo">∂</span>
        <span class="bname">Seminari 3<small>Càlcul · Enginyeria Informàtica</small></span>
      </div>
      <div class="hud">
        <div class="lvl" title="Nivell">
          <span class="lvl-n" id="hdr-level">1</span>
          <div class="lvl-info">
            <span class="lvl-t" id="hdr-title">Novell</span>
            <div class="xpbar"><i id="hdr-xpbar"></i></div>
            <span class="xptext" id="hdr-xptext">0 / 100 XP</span>
          </div>
        </div>
        <div class="chip streak" id="hdr-streak-wrap" title="Ratxa de dies seguits practicant">🔥 <b id="hdr-streak">0</b></div>
        <div class="chip combo" id="hdr-combo-wrap" title="Combo: apartats seguits encertats a la primera">⚡ <b id="hdr-combo">×0</b></div>
      </div>
    </div>
    <nav class="nav">
      <button data-view="home" class="active">🏠 Inici</button>
      <button data-view="learn">🎓 Aprèn</button>
      <button data-view="practice">✏️ Practica</button>
      <button data-view="exam">📝 Simulacre</button>
      <button data-view="theory">📚 Teoria</button>
      <button data-view="history">📊 Progrés</button>
    </nav>
  </header>

  <main>
    <div class="view" id="view-home"></div>
    <div class="view" id="view-learn" hidden></div>
    <div class="view" id="view-practice" hidden>
      <div id="practice-bar" class="practice-bar card"></div>
      <div id="practice-ex"></div>
    </div>
    <div class="view" id="view-exam" hidden></div>
    <div class="view" id="view-theory" hidden></div>
    <div class="view" id="view-history" hidden></div>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden></div>

  <script src="js/mathx.js"></script>
  <script src="js/plot.js"></script>
  <script src="js/gen.js"></script>
  <script src="js/theory.js"></script>
  <script src="js/lessons.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
